[workspace]
authors = ["R9950X_Sudoer <hhj@sudoer.cn>"]
channels = ["conda-forge"]
name = "PDF2HTML"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
pdf2html = { cmd = "python -m pdf2html", env = { PYTHONPATH = "src" } }
test = { cmd = "python -m pytest", env = { PYTHONPATH = "src" } }
lint = "python -m ruff check ."
typecheck = "python -m pyright"

[dependencies]
python = ">=3.12,<3.13"
pytest = ">=9.1.1,<10"
ruff = ">=0.16.5,<0.17"
pyright = ">=1.1.411,<2"
beautifulsoup4 = ">=4.14,<5"
httpx = ">=0.28,<0.29"
jinja2 = ">=3.1,<4"
markdown-it-py = ">=4,<5"
poppler = ">=25,<26"
pydantic = ">=2.12,<3"
pypdf = ">=6.6,<7"
typer = ">=0.20,<1"

[pypi-dependencies]
mineru = { version = ">=3.3,<4", extras = ["all"] }
latex2mathml = ">=3.79,<4"
torch = { url = "https://download.pytorch.org/whl/cu128/torch-2.8.0%2Bcu128-cp312-cp312-win_amd64.whl" }
torchvision = { url = "https://download.pytorch.org/whl/cu128/torchvision-0.23.0%2Bcu128-cp312-cp312-win_amd64.whl" }
